[project]
name = "css-unicode-range-parser"
version = "0.1.0"
description = "Parses and normalizes CSS unicode-range values, handling the U+ notation, wildcards, and question mark syntax."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
